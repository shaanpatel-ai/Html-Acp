<!DOCTYPE html>
<html>

<head>
    <title>My Grid Layout</title>
    <style>

        .grid-container {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            
            gap: 10px;
            background-color: lightblue;
            padding: 10px;
        }

        .grid-item {
            background-color: white;
            border: 1px solid darkblue;
            padding: 20px;
            text-align: center;
        }
        section{
            background-color: lightblue;
            border-radius: 70px;
            text-align: center;
        }
    </style>
</head>

<body>
<section>
    <h1>My Awesome Grid</h1>
    </section>

    <div class="grid-container">
        <div class="grid-item">Box 1</div>
        <div class="grid-item">Box 2</div>
        <div class="grid-item">Box 3</div>
        <div class="grid-item">Box 4</div>
        <div class="grid-item">Box 5</div>
        <div class="grid-item">Box 6</div>
        <img src="https://www.designmantic.com/blog/wp-content/uploads/2018/10/Grids-In-Design-1280x720.png" alt="Sorry this image is not avaible" width="200px">
    </div>

</body>

</html>
