<!DOCTYPE html>
<html>

<head>
    <title>Multiplication Fun</title>
</head>

<body>

    <h1>Let's Multiply Some Numbers!</h1>

    <script>
        let firstNumber = 8;
        let secondNumber = 5;
        let totalProduct = firstNumber * secondNumber;
        console.log("The answer to " + firstNumber + " multiplied by " + secondNumber + " is: " + totalProduct);
    </script>

    <p>Remember to open your browser's Developer Tools (usually right-click > Inspect, then go to the "Console" tab) to
        see the answer!</p>

</body>

</html>
